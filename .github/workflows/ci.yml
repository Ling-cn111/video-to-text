name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  backend:
    name: backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-cloud.txt
            backend/requirements-dev.txt

      # runtime 依赖（requirements.txt，内含 requirements-cloud.txt）
      # + 测试依赖（requirements-dev.txt：fakeredis）。
      # 缺少 fakeredis 会让 TaskStore / 限流的 Redis 用例被 importorskip 整体跳过 = 假绿（S1-F）。
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # test_audio_memory.py 的 FFmpeg 管道用例由 skipif(check_ffmpeg()) 守卫：
      # ubuntu runner 默认无 ffmpeg 时会被静默跳过 = 假绿（S1-E 实测 130 passed, 1 skipped）。
      # 固定安装 ffmpeg，并在测试前断言可用，防止该用例再次退化为 skip。
      #
      # 为什么要缓存 .deb：runner 镜像不预装 ffmpeg（实测 `Installed: (none)`），
      # 而 `apt-get install ffmpeg` 要拉 72 个包。慢的时候单个 libavcodec60（5.8 MB）
      # 就要 3 分钟，整步实测跑过 24 分 42 秒和 39 分 33 秒；而 `apt-get update`
      # 本身只用 1 秒（12.6 MB 索引 @ 11.2 MB/s）。所以慢的是包下载，不是索引。
      # 把 .deb 存到工作区缓存，命中时直接本地安装，不再走网络。
      - name: Cache FFmpeg .deb
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.apt-debs
          # key 带上 ffmpeg 版本：Ubuntu 镜像升级导致版本变化时会自动失效重建
          key: apt-debs-ffmpeg-${{ runner.os }}-7:6.1.1-3ubuntu5

      - name: Install FFmpeg
        run: |
          set -uo pipefail
          DEBS="$GITHUB_WORKSPACE/.apt-debs"
          mkdir -p "$DEBS/partial"
          sudo apt-get update
          # 先用缓存里的 .deb 装；缺包时 apt 会失败，再退回正常下载（同时回填缓存）
          if ! sudo apt-get install -y --no-download -o Dir::Cache::archives="$DEBS" ffmpeg; then
            echo "缓存未命中，改为在线下载（首次会慢，之后命中缓存）"
            sudo apt-get install -y -o Dir::Cache::archives="$DEBS" ffmpeg
          fi
          echo "缓存目录大小：$(du -sh "$DEBS" | cut -f1)"

      - name: Verify FFmpeg is available
        run: python -c "from app.services.audio import check_ffmpeg; raise SystemExit(0 if check_ffmpeg() else 'ffmpeg not on PATH')"

      # CI 跳过依赖外网真实视频的集成测试（-m network）、需要可选依赖 Demucs 的测试
      # （-m separation，见 backend/requirements-separation.txt）与需要大模型权重的
      # 本地引擎测试（-m asr_heavy，见 backend/requirements-asr.txt）；本地用 `pytest` 全量运行
      # -rs：在摘要里列出每个 skip 的原因，避免再次出现「被跳过但没人发现」
      - name: Test
        run: pytest -m "not network and not separation and not asr_heavy" -rs

  e2e:
    name: e2e locked features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # E2E 使用 Mock 模式（默认构建即 Mock）：验证 UI 锁定，不依赖后端
      - name: Build
        run: pnpm build

      - name: Run E2E (mock mode, all locks)
        run: pnpm playwright test

      # 真实模式构建：验证「Mock 标识在真实模式不出现」（E2E 锁定 7 第二阶段，任务 K）
      - name: Build (real mode)
        run: pnpm build
        env:
          NEXT_PUBLIC_USE_MOCK: "false"

      # 跑真实模式断言。NEXT_PUBLIC_USE_MOCK 必须同时传给测试进程：
      # 平台支持范围（SUPPORTED_PLATFORMS）是构建期常量，测试用例在 Node 里
      # import 同一份模块来判断「当前构建该宣称哪些平台」，env 不一致会两边打架。
      - name: Run E2E (real mode, lock 7)
        run: pnpm playwright test -g "锁定 7"
        env:
          VTT_EXPECT_MODE: real
          NEXT_PUBLIC_USE_MOCK: "false"

      # 平台宣称一致性（P0-4）：真实模式下抖音必须被前端拦下而不是放行到后端 422
      - name: Run E2E (real mode, platform claims)
        run: pnpm playwright test -g "平台宣称"
        env:
          VTT_EXPECT_MODE: real
          NEXT_PUBLIC_USE_MOCK: "false"
