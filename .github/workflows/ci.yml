name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  backend:
    name: backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # CI 跳过依赖外网真实视频的集成测试（-m network）、需要可选依赖 Demucs 的测试
      # （-m separation，见 backend/requirements-separation.txt）与需要大模型权重的
      # 本地引擎测试（-m asr_heavy，见 backend/requirements-asr.txt）；本地用 `pytest` 全量运行
      - name: Test
        run: pytest -m "not network and not separation and not asr_heavy"

  e2e:
    name: e2e locked features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # E2E 使用 Mock 模式（默认构建即 Mock）：验证 UI 锁定，不依赖后端
      - name: Build
        run: pnpm build

      - name: Run E2E (mock mode, all locks)
        run: pnpm playwright test

      # 真实模式构建：验证「Mock 标识在真实模式不出现」（E2E 锁定 7 第二阶段，任务 K）
      - name: Build (real mode)
        run: pnpm build
        env:
          NEXT_PUBLIC_USE_MOCK: "false"

      - name: Run E2E (real mode, lock 7)
        run: pnpm playwright test -g "锁定 7"
        env:
          VTT_EXPECT_MODE: real
