# 桌面端发版：打 tag → 自动构建、签名、发 Release（含自动更新所需的 latest.json）
#
# 为什么要有这个 workflow：v0.1.1 ~ v0.1.4 都是本地手工构建再 `gh release create`，
# 结果是「桌面端总是落后于 main」——因为没人愿意每次都手动跑一遍 Tauri 构建。
# 自动化之后，发版只需要推一个 tag。
#
# 需要配置的仓库 Secrets：
#   TAURI_SIGNING_PRIVATE_KEY           私钥内容（cat ~/.tauri/vtt-updater.key）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥口令（生成时留空则填空字符串）
# 私钥丢失 = 已安装的客户端再也收不到自动更新（新私钥签的包对旧客户端无效），
# 所以这份私钥必须离线备份，不能只存在 CI 里。
#
# 发版流程：
#   1. 三处版本号改成同一个值（package.json / tauri.conf.json / Cargo.toml）
#   2. （可选）写 docs/releases/v0.1.5.md 作为发布说明，不写则用 GitHub 自动生成的
#   3. git tag v0.1.5 && git push origin v0.1.5

name: Release Desktop

on:
  push:
    tags:
      - "v*"
  # 允许手动重跑（例如某次构建因网络失败）。
  # 注意：手动触发时 github.ref 是分支名，不是 tag，所以必须显式指定 tag 并在 checkout 时用上它，
  # 否则后面的版本校验会拿 "main" 去和 "v0.1.5" 比，必然失败。
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.1.5，需已存在）"
        required: true
      dry_run:
        description: "只构建不发布（验证流水线用）"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: build & release
    # Tauri 的 Windows 安装包必须在 Windows 上构建（WiX / NSIS 都是 Windows 工具链）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tag 推送时 github.ref 就是 refs/tags/v0.1.5；手动触发时是分支，需显式 checkout tag
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # 版本号与 tag 的一致性校验放在最前面：不通过就直接停，
      # 不要让用户白等 20 分钟的 Rust 编译才发现 tag 写错了。
      # 这里只用 node 读 JSON，不需要装依赖。
      - name: Verify tag matches version
        id: version
        shell: bash
        env:
          # 手动触发时 GITHUB_REF_NAME 是分支名，必须用输入框里的 tag
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "构建版本：$VERSION（tag $TAG_NAME）"
          if [ "$TAG_NAME" != "v$VERSION" ]; then
            echo "::error::tag $TAG_NAME 与 tauri.conf.json 的版本 v$VERSION 不一致"
            echo "::error::三处版本号必须一致：package.json / src-tauri/tauri.conf.json / src-tauri/Cargo.toml"
            exit 1
          fi
          # Cargo.toml 是独立的一份，v0.1.4 曾经漏改过（构建日志显示 Compiling app v0.1.3）
          CARGO_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::src-tauri/Cargo.toml 的版本是 $CARGO_VERSION，应为 $VERSION"
            exit 1
          fi

      # Rust 工具链：stable 足够，项目 rust-version 是 1.90
      - uses: dtolnay/rust-toolchain@stable

      # 编译缓存：Tauri 的依赖树很大（实测 1.6 GB / 300+ rlib），
      # 不缓存的话每次发版要跑 20 分钟以上
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 自动更新的签名私钥。不配这两个 Secret，构建会产出无签名的包，
      # make-latest-json.mjs 会直接失败退出 —— 这是故意的，宁可发版失败，
      # 也不要发一个客户端装不上的更新。
      - name: Build desktop bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 后端地址：静态壳没有 Node 服务端，必须内联绝对地址。
          # 用仓库变量覆盖，未配置时回落到线上 FC 函数。
          SHELL_API_BASE: ${{ vars.SHELL_API_BASE || 'https://video-ttext-api-thuxmkmghu.cn-hangzhou.fcapp.run' }}
        run: pnpm tauri build

      # 发布说明：优先用版本专属文件（能写人话），否则交给 GitHub 从 commit 生成
      - name: Resolve release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ -f "docs/releases/v${VERSION}.md" ]; then
            echo "file=docs/releases/v${VERSION}.md" >> "$GITHUB_OUTPUT"
            echo "使用 docs/releases/v${VERSION}.md"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "未找到 docs/releases/v${VERSION}.md，使用自动生成的说明"
          fi

      - name: Generate latest.json
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          node scripts/make-latest-json.mjs \
            --version "$VERSION" \
            --notes-file "$NOTES_FILE" \
            --out latest.json

      # gh 上传中文文件名会被剥成 `_`（v0.1.1 踩过），所以先重命名成 ASCII。
      # 产品名仍是「视频转文字」（在 tauri.conf.json 的 productName 里），用户无感。
      - name: Stage assets with ASCII names
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist
          NSIS="src-tauri/target/release/bundle/nsis/视频转文字_${VERSION}_x64-setup.exe"
          MSI="src-tauri/target/release/bundle/msi/视频转文字_${VERSION}_x64_zh-CN.msi"
          cp "$NSIS" "dist/video-to-text_${VERSION}_x64-setup.exe"
          cp "$MSI" "dist/video-to-text_${VERSION}_x64_zh-CN.msi"
          ls -l dist/

      - name: Publish release
        # dry_run 时只构建不发布：用来验证流水线本身（例如改了 Android job 之后），
        # 不用真的开一个新版本、也不用删一个已经发出去的 Release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          ASSETS=(
            "dist/video-to-text_${VERSION}_x64-setup.exe"
            "dist/video-to-text_${VERSION}_x64_zh-CN.msi"
            "latest.json"
          )
          # 重跑同一次发版时必须能成功：v0.1.7 就是 Android job 失败后重跑的，
          # Release 已经存在。`gh release create` 对已存在的 tag 会直接报错，
          # 所以先探测、存在就只覆盖资产。这样「某个 job 失败后重试整条流水线」
          # 才是可行的，不用先把 Release 删掉再发一遍（那会让已下载的用户措手不及）。
          #
          # 覆盖而不是跳过：exe 与 latest.json 是配套的（latest.json 里的签名是对着
          # 本次构建的 exe 生成的），只换一个会让自动更新验签失败。
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME 已存在，改为覆盖资产"
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber
          elif [ -n "$NOTES_FILE" ]; then
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file "$NOTES_FILE" \
              "${ASSETS[@]}"
          else
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --generate-notes \
              "${ASSETS[@]}"
          fi

  # ---------------------------------------------------------------------------
  # Android APK：与桌面端同一个 tag、同一个 Release。
  #
  # 为什么必须自动化：v0.1.4 ~ v0.1.6 的 APK 都是我本机 `gradlew assembleRelease` 之后
  # 手工 `gh release upload` 上去的。手工步骤的问题不是慢，是**会忘**——
  # Release 页面挂着桌面端新版本、手机端还是旧的，用户装上就以为是新功能没生效。
  #
  # 为什么单独一个 job 而不是塞进 desktop job：Tauri 的 Windows 安装包必须在
  # windows-latest 上构建（WiX / NSIS 是 Windows 工具链），而 Android 更快更省钱地跑
  # 在 ubuntu-latest（还要用 Linux 下的 JDK 与 SDK 工具链）。两个平台的依赖也没有交集。
  #
  # 为什么用 `needs: build`：APK 要传到**已经创建好的** Release 上。反过来的话，
  # 两个 job 同时 `gh release create` 会互相踩，后到的那个直接失败。
  # ---------------------------------------------------------------------------
  android:
    name: build & upload APK
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 必须 22+：`@capacitor/cli` 的 engines 是 `>=22.0.0`，Node 20 上
          # `npx cap sync` 直接 `[fatal] The Capacitor CLI requires NodeJS >=22.0.0`
          # （v0.1.7 第二次真跑撞到）。桌面端 job 用 20 不受影响（不跑 cap）。
          node-version: 22
          cache: pnpm

      # Capacitor 8 要求 JDK 21；ubuntu-latest 预装的 17 不够用（AGP 8.13 直接报
      # "Android Gradle plugin requires Java 21"）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # `packages` 必须显式写：action 默认值是 `tools platform-tools`，而新版
      # cmdline-tools 的 sdkmanager 里已经没有 `tools` 这个包了，会直接
      # "Warning: Failed to find package 'tools'" + exit 1（v0.1.7 首次真跑就撞上）。
      # 这里只需要 platform-tools（adb/sdkmanager）与 build-tools（apksigner/aapt2），
      # Gradle 自己会按 compileSdk 装 platform 与 build-tools 具体版本。
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Verify tag matches version
        id: version
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          if [ "$TAG_NAME" != "v$VERSION" ]; then
            echo "::error::tag $TAG_NAME 与 package.json 的版本 v$VERSION 不一致"
            exit 1
          fi
          # Android 的 versionName 也是独立一份，v0.1.6 曾漏改（APK 里还是 0.1.5）
          GRADLE_VERSION=$(grep -m1 'versionName "' android/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$GRADLE_VERSION" != "$VERSION" ]; then
            echo "::error::android/app/build.gradle 的 versionName 是 $GRADLE_VERSION，应为 $VERSION"
            exit 1
          fi
          echo "构建版本：$VERSION（tag $TAG_NAME）"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 静态壳没有 Node 服务端，后端地址必须在构建期内联成绝对地址。
      # 注意 build-shell.mjs 优先读 SHELL_API_BASE，其次 .env.local 的 BACKEND_ORIGIN——
      # 后者被 .gitignore 忽略，CI 上不存在，所以这里必须显式给。
      - name: Build mobile bundle
        env:
          SHELL_API_BASE: ${{ vars.SHELL_API_BASE || 'https://video-ttext-api-thuxmkmghu.cn-hangzhou.fcapp.run' }}
        run: pnpm build:mobile

      - name: Sync Capacitor android project
        run: npx cap sync android

      # 签名密钥从 Secrets 还原。keystore.properties 是 gitignore 的，CI 上没有它，
      # build.gradle 会跳过 signingConfigs.release → assembleRelease 产出的 APK
      # 没有签名，装不上，而且升级会丢（Android 用证书判定是不是同一个应用）。
      # 所以这里不还原就直接失败，不要产出一个"看起来成功"的废包。
      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secret ANDROID_KEYSTORE_BASE64，无法签名 APK"
            echo "::error::生成方式：base64 -w0 vtt-release.jks | pbcopy（或 certutil -encode）"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/vtt-release.jks"
          echo "已还原 keystore（$(stat -c%s "$RUNNER_TEMP/keystore/vtt-release.jks") 字节）"

      - name: Write keystore.properties
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 三个值都从 Secrets 来；缺任何一个都直接失败，不要用占位符糊过去
          for name in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 secret $name"
              exit 1
            fi
          done
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/keystore/vtt-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # 不用 init-mirrors.gradle：那是给国内网络绕开 dl.google.com 重置用的。
      # GitHub 托管 runner 在海外，官方仓库本来就通，多加一层镜像只会多一次解析。
      #
      # 用 `bash gradlew` 而不是 `./gradlew`：可执行位是 git 里的元数据，只有 main 上
      # 补过之后的新 tag 才有；已发布的 tag（如 v0.1.7）那份 commit 里 gradlew 仍是
      # 100644，Linux 上执行会 Permission denied（exit 126）。走 `bash` 显式解释
      # 就能跨过这个历史包袱，不必 force-push 已经发布出去的 tag。
      - name: Build release APK
        working-directory: android
        run: bash gradlew assembleRelease --no-daemon

      - name: Verify APK signature and version
        id: apk
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::没有产出 APK"; exit 1; }
          # 签名必须是 v2 及以上（v1 只是给 Android 6 及以下兜底，minSdk 24 用不到）
          #
          # 用退出码判断，不要 grep "verified"：`--print-certs` 的输出里**没有**
          # 那个词（只有加 `--verbose` 才有 "Verified using v2 scheme: true"）。
          # 一开始写成 grep "verified" 时，签名完全正常的包也会被判失败。
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/certs.txt
          grep -qi "Verified using v2 scheme .* true" /tmp/certs.txt \
            || { echo "::error::APK 没有 v2 签名，装不上"; exit 1; }
          grep -q "SHA-256" /tmp/certs.txt || { echo "::error::拿不到证书指纹，签名可能没生效"; exit 1; }
          # 版本号必须与 tag 一致：手工漏改 build.gradle 时这里能拦住
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion)" | tee /tmp/badging.txt
          grep -q "versionName='$VERSION'" /tmp/badging.txt || { echo "::error::APK 里的 versionName 不是 $VERSION"; exit 1; }
          echo "apk=dist/video-to-text_${VERSION}_android.apk" >> "$GITHUB_OUTPUT"

      - name: Stage APK with ASCII name
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/video-to-text_${VERSION}_android.apk"
          ls -l dist/

      - name: Upload APK to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release upload "$TAG_NAME" \
            "dist/video-to-text_${VERSION}_android.apk" \
            --clobber
